<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <filter id="shadow" x="-2%" y="-4%" width="104%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="760" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Title -->
  <text x="40" y="42" font-size="20" font-weight="700" fill="#0f172a">PulseWell — Google Workspace Studio Custom Starter Architecture</text>
  <text x="40" y="64" font-size="13" fill="#475569">Per-user OAuth 2.0 credential isolation, subscription lifecycle management, and asynchronous event firing</text>

  <!-- Actor / Participant Columns Header -->
  <g transform="translate(0, 82)">
    <rect x="40" y="0" width="150" height="44" rx="8" fill="#1e293b" filter="url(#shadow)"/>
    <text x="115" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Workspace Studio</text>
    <text x="115" y="35" text-anchor="middle" font-size="10" fill="#94a3b8">Flow Builder &amp; API</text>

    <rect x="230" y="0" width="170" height="44" rx="8" fill="#1d4ed8" filter="url(#shadow)"/>
    <text x="315" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Config &amp; OAuth</text>
    <text x="315" y="35" text-anchor="middle" font-size="10" fill="#bfdbfe">onConfig / oauthStart / Callback</text>

    <rect x="440" y="0" width="170" height="44" rx="8" fill="#047857" filter="url(#shadow)"/>
    <text x="525" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Trigger Manager</text>
    <text x="525" y="35" text-anchor="middle" font-size="10" fill="#a7f3d0">onManageSportsTrigger</text>

    <rect x="650" y="0" width="145" height="44" rx="8" fill="#4338ca" filter="url(#shadow)"/>
    <text x="722" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Firestore &amp; Secrets</text>
    <text x="722" y="35" text-anchor="middle" font-size="10" fill="#c7d2fe">/studioAuth • /studioTriggers</text>

    <rect x="830" y="0" width="130" height="44" rx="8" fill="#b45309" filter="url(#shadow)"/>
    <text x="895" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">PulseWell App</text>
    <text x="895" y="35" text-anchor="middle" font-size="10" fill="#fde68a">Web UI + Eventarc</text>
  </g>

  <!-- Vertical Lifelines -->
  <line x1="115" y1="126" x2="115" y2="730" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="315" y1="126" x2="315" y2="730" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="525" y1="126" x2="525" y2="730" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="722" y1="126" x2="722" y2="730" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="895" y1="126" x2="895" y2="730" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- ================= PHASE 1 ================= -->
  <rect x="30" y="142" width="940" height="175" rx="10" fill="#eff6ff" fill-opacity="0.75" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="42" y="152" width="380" height="24" rx="5" fill="#dbeafe"/>
  <text x="52" y="168" font-size="12" font-weight="700" fill="#1e40af">PHASE 1 — Starter Card Configuration &amp; Per-User Offline OAuth 2.0</text>

  <!-- Step 1 -->
  <line x1="115" y1="196" x2="307" y2="196" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="211" y="190" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">1. POST /onConfigSportsTrigger (userIdToken / userOAuthToken)</text>

  <!-- Step 2 -->
  <line x1="315" y1="224" x2="714" y2="224" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="515" y="218" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">2. Resolve userId (sub) &amp; check /studioAuth/{userId}</text>

  <!-- Step 3 -->
  <line x1="315" y1="254" x2="123" y2="254" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-blue)"/>
  <text x="215" y="248" text-anchor="middle" font-size="11" fill="#1e3a8a">3. Return Card UI (Authorize button + Category Filter)</text>

  <!-- Step 4 -->
  <line x1="315" y1="290" x2="714" y2="290" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="515" y="284" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a8a">4. OAuth Overlay (/oauthStart → /oauthCallback): Save refreshToken in /studioAuth/{userId}</text>

  <!-- ================= PHASE 2 ================= -->
  <rect x="30" y="332" width="940" height="145" rx="10" fill="#ecfdf5" fill-opacity="0.75" stroke="#a7f3d0" stroke-width="1.5"/>
  <rect x="42" y="342" width="380" height="24" rx="5" fill="#d1fae5"/>
  <text x="52" y="358" font-size="12" font-weight="700" fill="#065f46">PHASE 2 — Subscription Lifecycle (Turn Flow On / Off in Studio)</text>

  <!-- Step 5 -->
  <line x1="115" y1="390" x2="517" y2="390" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="316" y="384" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">5. Turn Flow ON → POST /onManageSportsTrigger (triggerCreation)</text>

  <!-- Step 6 -->
  <line x1="525" y1="422" x2="714" y2="422" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="620" y="415" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">6. Save { triggerId, userId, notifyUri }</text>
  <text x="620" y="435" text-anchor="middle" font-size="10" fill="#047857">in /studioTriggers/{triggerId}</text>

  <!-- Step 7 -->
  <line x1="115" y1="456" x2="714" y2="456" stroke="#059669" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow-green)"/>
  <text x="415" y="450" text-anchor="middle" font-size="11" fill="#065f46">7. Turn Flow OFF (triggerDeletion) → Delete /studioTriggers/{triggerId} document</text>

  <!-- ================= PHASE 3 ================= -->
  <rect x="30" y="492" width="940" height="245" rx="10" fill="#fffbeb" fill-opacity="0.8" stroke="#fde68a" stroke-width="1.5"/>
  <rect x="42" y="502" width="465" height="24" rx="5" fill="#fef3c7"/>
  <text x="52" y="518" font-size="12" font-weight="700" fill="#92400e">PHASE 3 — Asynchronous Event Firing (onRegistrationCreated)</text>

  <!-- Step 8 -->
  <line x1="895" y1="548" x2="730" y2="548" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="812" y="542" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">8. Write /registrations/{id}</text>

  <!-- Step 9 -->
  <line x1="722" y1="582" x2="887" y2="582" stroke="#d97706" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-amber)"/>
  <text x="804" y="576" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">9. Eventarc triggers onRegistrationCreated</text>

  <!-- Step 10 -->
  <line x1="895" y1="618" x2="730" y2="618" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <text x="812" y="612" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">10. Load /studioTriggers &amp; owner's /studioAuth/{userId}</text>

  <!-- Step 11 -->
  <line x1="895" y1="658" x2="123" y2="658" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <text x="509" y="651" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">11. POST https://workspacestudio.googleapis.com/v1/triggers/{triggerId}:fire</text>
  <text x="509" y="671" text-anchor="middle" font-size="10" fill="#b45309">Bearer &lt;ownerAccessToken&gt; + 6 output variables (recipientEmail, participantName, ...)</text>

  <!-- Step 12 -->
  <line x1="895" y1="706" x2="730" y2="706" stroke="#d97706" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-amber)"/>
  <text x="812" y="700" text-anchor="middle" font-size="11" fill="#92400e">12. Update /registrations/{id} (starterStatus: "fired") • Delete trigger on 404</text>
</svg>
